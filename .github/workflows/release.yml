name: Release

# Buduje aplikację i publikuje wydanie po wypchnięciu tagu w formacie vX.Y.Z,
# np. `git tag v1.0.1 && git push origin v1.0.1`.
# Wydanie zawiera APK (Android) oraz spakowaną aplikację Windows — to z nich
# korzysta wbudowana auto-aktualizacja (ota_update na Androidzie).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # potrzebne do utworzenia Release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Odtwórz keystore i key.properties z sekretów repozytorium.
      # Wymagane sekrety (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Konfiguracja podpisywania (release)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF

      # build-name pobierany z tagu (np. v1.0.1 -> 1.0.1)
      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Przenieś APK pod stałą nazwę
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/english-reader-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build windows --release --build-name="$VERSION" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Spakuj aplikację Windows
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/english-reader-$env:GITHUB_REF_NAME-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Utwórz Release i dołącz pliki
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-zip/*.zip

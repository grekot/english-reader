name: Release

# Tag vX.Y.Z, np. `git tag v1.1.4 && git push origin v1.1.4`.
# Android: wspólny workflow Sklepu rodzinnego (grekot/App_storage) buduje podpisany APK
#   english-reader.apk + app.json + icon.png. Wbudowana aktualizacja (update_service.dart)
#   bierze pierwszy plik .apk, więc stała nazwa jej nie przeszkadza.
#   Podpis: własny klucz aplikacji (sekrety ANDROID_*), ten sam co dotąd - aktualizacje w miejscu.
#   versionCode = numer przebiegu tego workflow (jak dotąd), więc dalej rośnie.
# Windows: spakowana aplikacja dołączana do tego samego wydania po Androidzie.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # potrzebne do utworzenia Release

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    uses: grekot/App_storage/.github/workflows/flutter-android-release.yml@main
    with:
      asset_name: english-reader
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ github.ref_name }}
      release_name: ${{ github.ref_name }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build windows --release --build-name="$VERSION" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Spakuj aplikację Windows
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/english-reader-$env:GITHUB_REF_NAME-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  # Dołącza zip Windows do wydania utworzonego przez job android (bez wyścigu).
  windows-release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Dołącz zip Windows do wydania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.zip
